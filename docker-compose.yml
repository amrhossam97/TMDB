version: "3.8"

services:
  redis:
    image: redis:7
    container_name: redis_tmdb
    restart: always
    ports:
      - "6379:6379"
  db:
    image: postgres:15
    container_name: postgres_tmdb
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DATABASE:-tmdb}
    volumes:
      - db_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: nest_tmdb_app
    ports:
      - "8080:3000"
    depends_on:
      - db
      - redis
    env_file:
      - .env
    environment:
      PORT: 3000
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    command: npm run start:prod

volumes:
  db_data:
